[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "py_fastfuzzy_rs"
version = "0.1.0"
description = "Blazingly fast multi-threaded fuzzy text matching and string distance engine for Python written in Rust."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Akmal Khan", email = "akmal@example.com" }
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
]
