[package]
name = "py_fastfuzzy_rs"
version = "0.1.0"
edition = "2021"
authors = ["Akmal Khan <akmalkhaniub>"]
description = "Blazingly fast multi-threaded fuzzy text matching and string distance engine for Python written in Rust with PyO3."
readme = "README.md"
license = "MIT"

[lib]
name = "py_fastfuzzy_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
